<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/mcpanel.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A focused Minecraft server management panel." />
    <meta name="color-scheme" content="light dark" />
    <title>MC Panel</title>
    <script>
      // Apply the saved theme before the first paint so dark mode never flashes light.
      (function () {
        try {
          var stored = localStorage.getItem("theme")
          var dark = stored === "dark" || (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches)
          var mode = dark ? "dark" : "light"
          document.documentElement.dataset.mode = mode
          document.documentElement.style.colorScheme = mode
        } catch (error) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
